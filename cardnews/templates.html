<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드뉴스 템플릿 7종</title>
  <link rel="stylesheet" href="cardnews.css">
</head>
<body class="cn-preview">
  <header>
    <h1>카드뉴스 템플릿 7종</h1>
    <p>Figma "카드뉴스" Frame 1–7 을 그대로 옮긴 견본입니다. 새 덱은 decks/ 의 예시를 복사해 문구와 사진만 바꾸세요. 남색 칸은 사진 자리입니다.</p>
  </header>

  <main class="cn-deck">
    <figure>
      <section class="cn-card cn-cover cn-on-dark">
        <div class="cn-photo"></div>
        <div class="cn-scrim cn-scrim--bottom"></div>
        <div class="cn-content">
          <span class="cn-pill">후킹용 문구를 적어요</span>
          <h2 class="cn-title">제목을 입력하세요<br>두줄로 작성하세요</h2>
          <p class="cn-subtitle">소제목을 써주세요</p>
        </div>
      </section>
      <figcaption>01 .cn-cover — 표지</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-intro cn-on-dark">
        <div class="cn-photo"></div>
        <div class="cn-scrim cn-scrim--top"></div>
        <div class="cn-content">
          <p class="cn-eyebrow">소제목 적을게요</p>
          <h2 class="cn-title">제목을 입력하세요<br>두줄로 작성하세요</h2>
          <p class="cn-point">포인트 문구 적을게요</p>
        </div>
      </section>
      <figcaption>02 .cn-intro — 도입</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-feature">
        <div class="cn-content">
          <div class="cn-image"></div>
          <h2 class="cn-title">제목을 작성하세요<br><span class="cn-hl">두줄로 작성하세요</span></h2>
          <p class="cn-desc">설명을 작성하요 설명을 작성하요<br>설명을 작성하요</p>
        </div>
      </section>
      <figcaption>03 .cn-feature — 포인트</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-story">
        <div class="cn-content">
          <p class="cn-eyebrow">제목을 작성하세요</p>
          <h2 class="cn-title">제목을 작성하세요</h2>
          <div class="cn-image"></div>
          <p class="cn-body">설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요 설명을 작성하요</p>
        </div>
      </section>
      <figcaption>04 .cn-story — 본문</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-checklist">
        <div class="cn-content">
          <h2 class="cn-title">제목을 작성하겠습니다</h2>
          <ul class="cn-list">
            <li><p class="cn-item-title">첫번째 내용을 적을게요</p><p class="cn-item-desc">구체적인 내용을 적어주세요 구체적인 내용을 적어주세요<br>구체적인 내용을 적어주세요 구체적인 내용을 적어주세요</p></li>
            <li><p class="cn-item-title">두번째 내용을 적을게요</p><p class="cn-item-desc">구체적인 내용을 적어주세요 구체적인 내용을 적어주세요<br>구체적인 내용을 적어주세요 구체적인 내용을 적어주세요</p></li>
            <li><p class="cn-item-title">세번째 내용을 적을게요</p><p class="cn-item-desc">구체적인 내용을 적어주세요 구체적인 내용을 적어주세요<br>구체적인 내용을 적어주세요 구체적인 내용을 적어주세요</p></li>
          </ul>
        </div>
      </section>
      <figcaption>05 .cn-checklist — 리스트</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-faq">
        <div class="cn-content">
          <h2 class="cn-title">타이틀을 여기에 적을게요<br>타이틀을 여기에 적을게요</h2>
          <p class="cn-bubble cn-bubble--q">오늘 내용에 대한 FAQ 적으면 좋겠네요</p>
          <div class="cn-image"></div>
          <p class="cn-bubble cn-bubble--a">오늘 내용에 대한 FAQ 적으면 좋겠네요</p>
        </div>
      </section>
      <figcaption>06 .cn-faq — FAQ</figcaption>
    </figure>

    <figure>
      <section class="cn-card cn-closing cn-on-dark">
        <div class="cn-photo"></div>
        <div class="cn-scrim cn-scrim--flat"></div>
        <div class="cn-content">
          <p class="cn-lead">지금 트렌드에 맞는<br>기업 교육을 찾으신다면</p>
          <h2 class="cn-title">인싸이트러닝이 정답입니다</h2>
        </div>
      </section>
      <figcaption>07 .cn-closing — 마무리</figcaption>
    </figure>
  </main>
</body>
</html>
