<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 03 Content (composed shell; header/footer only; body composed by Executor) -->
  <!-- Signature: light slide label top-left above the navy title rule
       (short 5px segment + long 2px line), one centered headline -->

  <rect width="1280" height="720" fill="{{TOKEN:colors.bg}}"/>

  <!-- Slide label (top-left, Light) -->
  <text x="56" y="50" font-family="{{TOKEN:typography.font-chain}}"
        font-size="22" font-weight="300" letter-spacing="-0.44"
        fill="{{TOKEN:colors.text}}">
    {{PAGE_EYEBROW}}
  </text>

  <!-- Title rule: short bold segment + long thin line, navy -->
  <rect x="56" y="64" width="133" height="5" fill="{{TOKEN:colors.accent}}"/>
  <rect x="189" y="67" width="1035" height="2" fill="{{TOKEN:colors.accent}}"/>

  <!-- Headline: the one centered claim per slide -->
  <text x="640" y="126" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.headline.size}}" font-weight="{{TOKEN:typography.headline.weight}}"
        letter-spacing="{{TOKEN:typography.headline.letter-spacing}}"
        text-anchor="middle"
        fill="{{TOKEN:colors.text}}">
    {{PAGE_TITLE}}
  </text>

  <!-- CONTENT AREA (Executor fills this region freely) -->
  <!-- x=56, y=160, w=1168, h=480 — everything above GM, below headline -->

  <!-- Governing Message (GM) — mandatory on every content slide, centered, bottom -->
  <text x="640" y="680" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.body.size}}" font-weight="700"
        text-anchor="middle"
        fill="{{TOKEN:colors.text-secondary}}">
    {{GOVERNING_MESSAGE}}
  </text>

  <!-- Page number (bottom right, caption) -->
  <text x="1224" y="696" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.caption.size}}" font-weight="{{TOKEN:typography.caption.weight}}"
        text-anchor="end"
        fill="{{TOKEN:colors.text-tertiary}}">
    {{PAGE_NUM}}
  </text>
</svg>
