<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 01 Cover (composed shell) -->
  <!-- Signature: navy field on the left cut by a diagonal edge, thin sky stripe along the cut,
       darker navy panel on the right (place a grayscale photo with navy wash here when available) -->

  <!-- Right panel (photo slot) -->
  <rect width="1280" height="720" fill="{{TOKEN:colors.accent-ink}}"/>

  <!-- Navy field with diagonal edge -->
  <polygon points="0,0 820,0 660,720 0,720" fill="{{TOKEN:colors.shell-bg}}"/>

  <!-- Thin sky stripe along the cut -->
  <polygon points="820,0 828,0 668,720 660,720" fill="{{TOKEN:colors.shell-accent}}"/>

  <!-- Eyebrow (uppercase, widely tracked, sky) -->
  <text x="72" y="210" font-family="{{TOKEN:typography.font-chain}}"
        font-size="18" font-weight="400" letter-spacing="7"
        fill="{{TOKEN:colors.shell-accent}}">
    {{EYEBROW}}
  </text>

  <!-- Primary title (Display) -->
  <text x="72" y="330" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.display.size}}" font-weight="{{TOKEN:typography.display.weight}}"
        letter-spacing="{{TOKEN:typography.display.letter-spacing}}"
        fill="{{TOKEN:colors.shell-text}}">
    {{TITLE}}
  </text>

  <!-- Highlighted second line (sky on navy) -->
  <text x="72" y="396" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.display-sm.size}}" font-weight="{{TOKEN:typography.display-sm.weight}}"
        letter-spacing="{{TOKEN:typography.display-sm.letter-spacing}}"
        fill="{{TOKEN:colors.shell-accent}}">
    {{TITLE_ACCENT}}
  </text>

  <!-- Subtitle (Title) -->
  <text x="72" y="456" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.title.size}}" font-weight="{{TOKEN:typography.title.weight}}"
        fill="{{TOKEN:colors.shell-text}}">
    {{SUBTITLE}}
  </text>

  <!-- Presenter / date line -->
  <text x="72" y="656" font-family="{{TOKEN:typography.font-chain}}"
        font-size="{{TOKEN:typography.caption.size}}" font-weight="{{TOKEN:typography.caption.weight}}"
        fill="{{TOKEN:colors.shell-text-secondary}}">
    {{PRESENTER}} · {{DATE}}
  </text>
</svg>
