<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 03 Content (composed shell; header/footer only; body composed by Executor) -->
  <!-- Signature: light slide label top-left above the navy title rule
       (short 5px segment + long 2px line), one centered headline -->

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Slide label (top-left, Light) -->
  <text x="56" y="60" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="22" font-weight="300" letter-spacing="-0.44"
        fill="#000000">
    {{PAGE_EYEBROW}}
  </text>

  <!-- Title rule: short bold segment + long thin line, navy -->
  <rect x="56" y="72" width="133" height="5" fill="#012281"/>
  <rect x="189" y="75" width="1035" height="2" fill="#012281"/>

  <!-- Headline: the one centered claim per slide -->
  <text x="640" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="30" font-weight="800"
        letter-spacing="-0.9"
        text-anchor="middle"
        fill="#000000">
    {{PAGE_TITLE}}
  </text>

  <!-- CONTENT AREA (Executor fills this region freely) -->
  <!-- x=56, y=160, w=1168, h=480 — everything above GM, below headline -->

  <!-- Governing Message (GM) — mandatory on every content slide, centered, bottom -->
  <text x="640" y="680" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="15.2" font-weight="700"
        text-anchor="middle"
        fill="#595959">
    {{GOVERNING_MESSAGE}}
  </text>

  <!-- Page number (bottom right, caption) -->
  <text x="1224" y="696" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="12.8" font-weight="400"
        text-anchor="end"
        fill="#666666">
    {{PAGE_NUM}}
  </text>
</svg>
