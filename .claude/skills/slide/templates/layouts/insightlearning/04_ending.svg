<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 04 Ending. Full navy band with a centered sky-blue frame (brochure closing page). Logo: place assets/brand/insightlearning-logo-white.png centered above the label via ../images/. -->

  <rect width="1280" height="720" fill="#012281"/>

  <!-- Sky frame -->
  <rect x="240" y="104" width="800" height="512" fill="none" stroke="#58CCFF" stroke-width="8"/>

  <text x="640" y="232"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="17.6" font-weight="400"
        letter-spacing="7"
        text-anchor="middle"
        fill="#58CCFF">
    {{CLOSING_LABEL}}
  </text>

  <text x="640" y="336"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="56" font-weight="800"
        letter-spacing="-1.68"
        text-anchor="middle"
        fill="#FFFFFF">
    {{CLOSING_HEADLINE}}
  </text>

  <text x="640" y="400"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="40" font-weight="800"
        letter-spacing="-0.8"
        text-anchor="middle"
        fill="#58CCFF">
    {{CLOSING_ACCENT}}
  </text>

  <text x="640" y="480"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="17.6" font-weight="400"
        text-anchor="middle"
        fill="#D2D6E3">
    {{CONTACT_LINE}}
  </text>

  <text x="640" y="672"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="12.8" font-weight="400"
        text-anchor="middle"
        fill="#D2D6E3">
    {{PRESENTER}} · {{DATE}}
  </text>
</svg>
