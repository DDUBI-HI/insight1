<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 01 Cover. Navy field, diagonal cut with a thin sky stripe, darker wedge standing in for the grayscale photo (Design System: Cover). Logo: place assets/brand/insightlearning-logo-white.png top-left (x=56, y=48, h=28) via ../images/. -->

  <rect width="1280" height="720" fill="#012281"/>

  <!-- Photo stand-in wedge + thin sky stripe along the cut -->
  <polygon points="836,0 1280,0 1280,720 1060,720" fill="#1F375D"/>
  <polygon points="824,0 836,0 1060,720 1048,720" fill="#58CCFF"/>

  <!-- Eyebrow: uppercase, widely tracked (0.4em), sky -->
  <text x="56" y="232"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="17.6" font-weight="400"
        letter-spacing="7"
        fill="#58CCFF">
    {{EYEBROW}}
  </text>

  <!-- Hero headline, line 1 (white, 700, -0.03em) -->
  <text x="56" y="316"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="52" font-weight="700"
        letter-spacing="-1.56"
        fill="#FFFFFF">
    {{TITLE}}
  </text>

  <!-- Hero headline, line 2 -->
  <text x="56" y="380"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="52" font-weight="700"
        letter-spacing="-1.56"
        fill="#FFFFFF">
    {{TITLE_ACCENT}}
  </text>

  <!-- Lead (white) -->
  <text x="56" y="440"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="17.6" font-weight="400"
        fill="#FFFFFF">
    {{SUBTITLE}}
  </text>

  <!-- Presenter / date -->
  <text x="56" y="656"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="15.2" font-weight="400"
        fill="#D2D6E3">
    {{PRESENTER}} · {{DATE}}
  </text>
</svg>
