<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Insightlearning — 02 Chapter / Section opener (composed shell) -->
  <!-- Signature: square navy section block on the left with the two-digit number in a sky square;
       English uppercase section title in heavy display on white, Korean title beneath in navy -->

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Navy section block (square, full height) -->
  <rect x="0" y="0" width="440" height="720" fill="#012281"/>

  <!-- Sky number block -->
  <rect x="72" y="232" width="128" height="128" fill="#58CCFF"/>
  <text x="136" y="314" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="48" font-weight="300" text-anchor="middle"
        fill="#FFFFFF">
    {{CHAPTER_NUMBER}}
  </text>

  <!-- English section title (uppercase, heavy display) -->
  <text x="520" y="318" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="56" font-weight="900" letter-spacing="-0.56"
        fill="#000000">
    {{CHAPTER_LABEL}}
  </text>

  <!-- Korean title beneath, in navy -->
  <text x="520" y="374" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="30" font-weight="800"
        letter-spacing="-0.9"
        fill="#012281">
    {{CHAPTER_TITLE}}
  </text>

  <!-- Title rule: short bold segment -->
  <rect x="520" y="402" width="133" height="5" fill="#012281"/>

  <!-- Supporting line -->
  <text x="520" y="448" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="15.2" font-weight="400"
        letter-spacing="-0.3"
        fill="#595959">
    {{CHAPTER_SUMMARY}}
  </text>

  <!-- Page number (bottom right) -->
  <text x="1224" y="696" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif"
        font-size="12.8" font-weight="400"
        text-anchor="end"
        fill="#666666">
    {{PAGE_NUM}}
  </text>
</svg>
