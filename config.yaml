# 네이버 카페 교육 문의 → 카카오톡 알림 설정
# 비밀값(카카오 키, 네이버 쿠키 등)은 여기에 넣지 말고 .env 또는 GitHub Secrets에 넣으세요.

cafe:
  name: 인사쟁이
  # 카페 주소의 마지막 부분 (예: https://cafe.naver.com/xxxx → xxxx)
  url: ""
  # 숫자 카페 ID. `python -m cafe_alert resolve-clubid <카페주소>`로 확인
  # (GitHub Actions에서는 NAVER_CAFE_CLUB_ID 변수로 넣어도 됨)
  club_id: ""
  # 특정 게시판만 볼 때 메뉴 ID 목록. 비우면 '전체글보기'
  # (게시판 주소의 menuid=숫자. 예: 교육문의/업체추천 게시판)
  menu_ids: []
  # cafe_api  : 카페 게시글 목록을 직접 조회 (회원 전용 글은 로그인 쿠키 필요) ← 권장
  # search_api: 네이버 검색 API로 조회 (로그인 불필요, 전체공개 글만 잡힘)
  source: cafe_api
  # 제목에 키워드가 없어도 본문에서 찾기 (cafe_api 모드에서 새 글만 본문 조회)
  check_body: true
  per_page: 50
  # search_api 모드에서 사용할 검색어 (비우면 keywords.topics 사용)
  search_queries: []

keywords:
  # 주제 키워드: 하나 이상 포함되어야 함 (영문은 단어 단위로 매칭: 'AI'는 'MAIL'에 걸리지 않음)
  topics:
    - 리더십
    - 리더쉽
    - 팀장
    - 중간관리자
    - 관리자 교육
    - 신임
    - 코칭
    - AI
    - 인공지능
    - 생성형
    - ChatGPT
    - 챗GPT
    - GPT
    - 프롬프트
    - 디지털 전환
    - DX
    - 기업교육
    - 사내교육
    - 임직원 교육
    - 직원 교육
    - 직무교육
    - 신입사원 교육
    - 승진자 교육
    - 조직문화
    - 워크숍
    - 워크샵
  # 문의 키워드: require_intent가 true면 이 중 하나도 있어야 함 (단순 정보글/후기 걸러내기)
  intents:
    - 문의
    - 추천
    - 찾습니다
    - 찾고
    - 찾아요
    - 구합니다
    - 소개
    - 견적
    - 업체
    - 기관
    - 강사
    - 강사님
    - 강의
    - 특강
    - 섭외
    - 의뢰
    - 어디
    - 있을까요
    - 있나요
    - 부탁
    - 도움
  require_intent: true
  # 제목에 포함되면 제외 (채용·홍보글 등)
  exclude:
    - 채용
    - 구인
    - 이직
    - 연봉
    - 홍보
    - 광고
    - 모집합니다
    - 무료특강 안내

notify:
  # 한 번 실행에 개별 알림 최대 개수 (초과분은 묶어서 1건으로)
  max_per_run: 10
  # 최초 실행 시 '알림 시작' 메시지 전송
  on_start: true
