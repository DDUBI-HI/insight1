name: 카드뉴스 렌더

# cardnews/ 아래 HTML·CSS·images.json 이 바뀌면
# Unsplash 사진을 받고 → Playwright 로 캡처해 → out/*.png 를 같은 브랜치에 커밋합니다.

on:
  push:
    paths:
      - "cardnews/**"
      - "fonts/**"
      - ".github/workflows/cardnews-render.yml"
      - "!cardnews/decks/*/out/**"
      - "!cardnews/decks/*/CREDITS.md"
  workflow_dispatch:
    inputs:
      deck:
        description: "렌더할 덱 폴더 이름 (비우면 전체)"
        required: false
        default: ""
      refetch:
        description: "사진을 모두 다시 받기"
        type: boolean
        default: false

concurrency:
  group: cardnews-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cardnews
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cardnews/package-lock.json

      - name: 의존성 설치
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Unsplash 사진 받기
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          target="${{ github.event.inputs.deck }}"
          node scripts/fetch-images.mjs ${target:+decks/$target} ${{ github.event.inputs.refetch == 'true' && '--force' || '' }}

      - name: PNG 렌더
        run: |
          target="${{ github.event.inputs.deck }}"
          node scripts/render.mjs ${target:+decks/$target}

      - uses: actions/upload-artifact@v4
        with:
          name: cardnews-png
          path: cardnews/decks/*/out/*.png

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decks/*/out decks/*/images.json decks/*/CREDITS.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "cardnews: render PNG [skip ci]"
            git push
          fi
