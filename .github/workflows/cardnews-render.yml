name: 카드뉴스 렌더

# cardnews/ 아래 HTML·CSS·images.json 이 바뀌면
# Unsplash 사진을 받고 → Playwright 로 캡처해 → out/*.png 를 같은 브랜치에 커밋합니다.

on:
  push:
    paths:
      - "cardnews/**"
      - "fonts/**"
      - ".github/workflows/cardnews-render.yml"
      - "!cardnews/decks/*/out/**"
      - "!cardnews/decks/*/CREDITS.md"
  workflow_dispatch:
    inputs:
      deck:
        description: "렌더할 덱 폴더 이름 (비우면 전체)"
        required: false
        default: ""
      refetch:
        description: "사진을 모두 다시 받기"
        type: boolean
        default: false

concurrency:
  group: cardnews-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cardnews
    steps:
      - uses: actions/checkout@v4

      - name: Unsplash 키 확인
        id: key
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          if [ -n "$UNSPLASH_ACCESS_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=UNSPLASH_ACCESS_KEY 없음::저장소 Settings → Secrets and variables → Actions 에 UNSPLASH_ACCESS_KEY 를 등록하면 사진을 받아 PNG 를 렌더합니다 (cardnews/README.md 참고)."
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cardnews/package-lock.json

      - name: 의존성 설치
        if: steps.key.outputs.ok == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Unsplash 사진 받기
        if: steps.key.outputs.ok == 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          target="${{ github.event.inputs.deck }}"
          node scripts/fetch-images.mjs ${target:+decks/$target} ${{ github.event.inputs.refetch == 'true' && '--force' || '' }}

      - name: PNG 렌더
        if: steps.key.outputs.ok == 'true'
        run: |
          target="${{ github.event.inputs.deck }}"
          node scripts/render.mjs ${target:+decks/$target}

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: cardnews-png
          path: cardnews/decks/*/out/*.png

      - name: 결과 커밋
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decks/*/out decks/*/images.json decks/*/CREDITS.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "cardnews: render PNG [skip ci]"
          # 렌더 중에 브랜치에 새 커밋이 올라왔으면 그 위에 얹어 다시 push 합니다.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if ! git pull --rebase; then
              # 같은 파일이 바뀌어 충돌하면, 새 커밋으로 시작된 다음 렌더가 결과를 올리므로 이번 결과는 버립니다.
              git rebase --abort
              echo "::notice::브랜치가 바뀌어 이번 렌더 결과는 올리지 않습니다. 새 커밋의 렌더가 이어서 처리합니다."
              exit 0
            fi
          done
          echo "::error::렌더 결과를 push 하지 못했습니다."
          exit 1
