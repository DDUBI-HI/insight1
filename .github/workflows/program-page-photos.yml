name: 상세페이지 표지 사진 받기

# program-page/photos/<세트>/images.json 이 바뀌면
# 공식 Unsplash API(UNSPLASH_ACCESS_KEY Secret, 카드뉴스와 같은 키)로 사진을 받아
# images/*.jpg · images.json(사진가 정보) · CREDITS.md 를 같은 브랜치에 커밋합니다.
# 사진 받는 코드는 cardnews/scripts/fetch-images.mjs 를 그대로 씁니다.

on:
  push:
    paths:
      - "program-page/photos/*/images.json"
      - ".github/workflows/program-page-photos.yml"
  workflow_dispatch:

concurrency:
  group: program-page-photos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 이미 받은 사진(사진가 정보가 기록된 항목)은 건너뛰므로 API 요청은 새 사진에만 씁니다.
      # 요청 한도(데모 키 50회/시간, 사진 1장에 약 3회)에 걸려도 받은 사진은 커밋하고 마지막에 실패로 알립니다.
      - name: Unsplash 사진 받기
        id: fetch
        continue-on-error: true
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node cardnews/scripts/fetch-images.mjs program-page/photos/*/

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program-page/photos
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "program-page: fetch cover photos [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase || { git rebase --abort; echo "::error::브랜치가 바뀌어 push 하지 못했습니다. 다시 실행하세요."; exit 1; }
          done
          echo "::error::사진을 push 하지 못했습니다."
          exit 1

      - name: 받지 못한 사진 알림
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::받지 못한 사진이 있습니다. 요청 한도 초과면 1시간 뒤 images.json 을 다시 push 하거나 이 워크플로를 다시 실행하세요."
          exit 1
