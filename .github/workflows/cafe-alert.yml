name: 카페 교육문의 알림

on:
  schedule:
    # 10분마다 (UTC 기준 cron. GitHub 사정으로 수 분 지연될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "카톡 전송 없이 결과만 확인"
        type: boolean
        default: false

concurrency:
  group: cafe-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 이미 확인한 글 목록(data/seen.json)을 이전 실행에서 이어받음
      - name: 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: 새 글 확인 및 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NAVER_NID_AUT: ${{ secrets.NAVER_NID_AUT }}
          NAVER_NID_SES: ${{ secrets.NAVER_NID_SES }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_CAFE_CLUB_ID: ${{ vars.NAVER_CAFE_CLUB_ID }}
        run: |
          if [ -z "$KAKAO_REST_API_KEY" ]; then
            echo "::notice::KAKAO_REST_API_KEY Secret이 없어 건너뜁니다. README의 설정 방법을 따라 등록하세요."
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m cafe_alert run --dry-run
          else
            python -m cafe_alert run
          fi

      - name: 상태 저장
        if: always() && hashFiles('data/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}-${{ github.run_attempt }}

      # 카카오 refresh token(유효기간 2개월)이 갱신되면 Secret을 자동 업데이트
      - name: 카카오 refresh token 갱신
        if: always() && hashFiles('data/rotated_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::카카오 refresh token이 갱신됐지만 GH_PAT Secret이 없어 자동 저장하지 못했습니다. README의 '토큰 자동 갱신'을 참고하세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < data/rotated_refresh_token
          echo "KAKAO_REFRESH_TOKEN Secret을 갱신했습니다."
